    put:
      summary: Edit an Invoice Schedule
      description: Update an existing invoice schedule, allowing changes to metadata, recurrence rules, or the schedule's active status.
      operationId: editInvoiceSchedule
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the invoice schedule to update.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                total:
                  type: number
                  description: The total amount for the invoice.
                rule:
                  type: string
                  description: The iCalendar RRule recurrence rule string.
                active:
                  type: boolean
                  description: Whether the schedule is active. Set to false to pause.
                email_notification:
                  type: boolean
                  description: Whether to send email notifications when invoices are generated.
                files:
                  type: array
                  description: Array of file IDs to attach to the schedule.
                  items:
                    type: string
                meta:
                  type: object
                  description: Metadata for the invoice, including line items, tax, and other details.
                  properties:
                    subtotal:
                      type: number
                      description: The subtotal amount before tax and fees.
                    tax:
                      type: number
                      description: The tax amount applied to the invoice.
                    fee:
                      type: number
                      description: An optional fee amount in dollars (not cents).
                      minimum: 0
                    poNumber:
                      type: string
                      nullable: true
                      description: An optional purchase order number.
                    shippingAmount:
                      type: number
                      description: The shipping amount for the invoice.
                      minimum: 0
                    hideCustomerLineItems:
                      type: boolean
                      nullable: true
                      description: When set to true, line item details are hidden from customer-facing emails and receipts. Line items remain stored on the invoice and are passed to the payment gateway.
                    lineItems:
                      type: array
                      description: Array of line items for the invoice.
                      items:
                        type: object
                        properties:
                          item:
                            type: string
                            description: The name or description of the item.
                          quantity:
                            type: number
                            description: The quantity of the item.
                          price:
                            type: number
                            description: The price per unit of the item.
      responses:
        '200':
          description: Schedule successfully updated.
        '400':
          description: Bad Request - Invalid fields or missing required parameters.
        '422':
          description: Validation Error - DTSTART or next_run_at is in the past, or invalid field values.
        '500':
          description: Internal Server Error.
      tags:
      - Invoice
