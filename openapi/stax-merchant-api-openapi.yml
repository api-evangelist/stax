  /merchant/{id}/apikey:
    post:
      summary: Create a New API Key for Merchant
      description: Generates a new API key for the specified merchant.
      operationId: create-a-new-api-key-for-merchant
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: Merchant ID for which to create a new API key.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ' Name for the key. 255 character max. Example: "api-key-1"'
                team_role:
                  type: string
                  enum:
                  - '"admin"'
                  - '"staff"'
                  - '"full"'
                  - '"reporting"'
                  description: We recommend "admin" so the API key can be used for all routes.
                  default: full
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security:
      - PartnerApiKey: []
      tags:
      - Merchant
