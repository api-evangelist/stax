          application/json:
            schema:
              type: object
              properties:
                total:
                  type: number
                  format: float
                  required: true
                  description: '(Min: 0.01) The amount of the void. This endpoint should only be used if you are certain the transaction has NOT BEEN batched (still in open batch). For most use cases, use POST /terminal/void-or-refund instead, which will automatically determine whether to void or refund based on batch timing (typically 8pm EST).'
                meta:
                  type: string
                  format: json
                  required: true
                  description: (required, json literal) i.e. {"tax":2,"subtotal":10} can contain any json object. Will be blindly stored and returned during a GET operation. Values in meta may also appear in an email receipt if the template calls for it. The Stax front-end uses subtotal, tax, memo, lineItems = [].
                printReceipt:
                  type: string
                  enum:
                  - Both
                  - Customer
                  - Merchant
                  - 'No'
                  default: Both
                  description: 'Possible values: No, Merchant, Customer, Both. Defaults to Both.'
                paymentType:
                  type: string
                  enum:
                  - Credit
                  - Debit
                  - Check
                  - Gift
                  - Loyalty
                  default: Credit
                  description: 'Possible values: Credit, Debit, Check, Gift, Loyalty. Defaults to Credit.'
                customerId:
                  type: string
                  description: The id of the customer attributed to this credit.
                invoiceId:
                  type: string
                  description: The id of the invoice attributed to this charge.
                register:
                  type: string
                  required: true
                  description: The id of the register performing this operation. This should be the 'id' value returned by GET /terminal/register, not the serial or status_port. The register must match the register used for the original transaction.
              required:
              - total
              - register
      tags:
      - Terminal
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API key for merchant-level operations. Provides access to merchant-specific endpoints including transactions, payments, customer management, and merchant account settings. This key is scoped to a single merchant account and cannot access partner-level functionality.
    PartnerApiKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Partner-level API key with elevated privileges. Grants access to all partner operations including merchant management, portfolio oversight, reporting across multiple merchant accounts, and partner-specific administrative functions. Also provides access to all merchant-level operations for accounts under the partner's management.
    EphemeralAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Temporary authentication token with limited lifespan. Used for short-term access to specific operations, typically generated for secure one-time actions or time-bounded sessions. Automatically expires after a predefined period for enhanced security.
