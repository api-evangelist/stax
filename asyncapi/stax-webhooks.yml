generated: '2026-08-29'
method: searched
source: https://docs.staxpayments.com/docs/merchant-webhooks + https://docs.staxpayments.com/docs/partner-webhooks
note: Stax publishes NO AsyncAPI document. It documents a real webhook surface with two levels — merchant webhooks scoped
  to one account, and partner (brand) webhooks that fire for every sub-merchant under an ISV brand — plus REST operations
  to manage them. This artifact is the webhook catalog, not a fabricated AsyncAPI.
asyncapi_published: false
delivery:
  transport: HTTPS POST
  content_type: application/json
  event_name_header: stax-event-name
  body: The object associated with the event (for example the transaction object for create_transaction) — generally the same
    payload as the matching GET.
  tls: Receiving endpoints must serve a valid public-CA certificate and negotiate TLS 1.2 or 1.3; self-signed certificates
    are prohibited (reference/tls-security-standards).
  signing: null
  signing_note: Stax documents no HMAC signature or shared-secret verification for webhook payloads; verification is left
    to the receiver.
retries:
  configurable: true
  fields:
  - field: meta.response_body
    meaning: true enables one retry five minutes after a failure
  - field: meta.webhook_retry_frequency
    meaning: retry interval in minutes
  - field: meta.webhook_retry_count
    meaning: number of retries on failure
