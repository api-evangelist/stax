- scope: global
  surface: the API generally, as stated on the reference Overview page
  window: 1 minute
  limit: 100
  burst: null
  on_exhaustion: 429 Too Many Requests
  source: https://docs.staxpayments.com/reference/overview
response_headers:
  documented:
  - Retry-After
  not_documented:
  - X-RateLimit-Limit
  - X-RateLimit-Remaining
  - X-RateLimit-Reset
  - RateLimit-Limit
  - RateLimit-Remaining
  - RateLimit-Reset
  status_on_exhaustion: 429
  note: Retry-After is the only runtime signal Stax documents, and it is documented on the Overview page against the 100/min
    figure. No RateLimit-* or X-RateLimit-* headers are published, and 429 is declared on ZERO of the 133 operations in the
    contract — so an agent has no in-band budget signal and learns its remaining quota only by being cut off.
increase_path: Contact Stax support or partner support to have IP addresses allowlisted or limits raised.
