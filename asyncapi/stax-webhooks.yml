merchant_events:
- event: create_customer
  description: A customer is created. Returns Customer object.
- event: create_deposit
  description: A settlement is processed. The payload of the webhook contains the settlement record. The `external_id` is
    the connector between the deposit record and the deposit details. This webhook DOES fire in the sandbox, but in the sandbox
    environment, the external\_id will not match the batch\_id - in the sandbox, you can use this webhook as a notification
    and build your system to call out to the merchant's deposit APIs to get the latest deposit details.
