  /transaction:
    get:
      summary: List and Filter All Transactions
      description: Retrieve a list of all transactions for the merchant account. Use query parameters to filter and sort transactions based on criteria such as date range, transaction type, status, amount, and more.
      operationId: list-and-filter-all-transactions
      parameters:
      - name: export
        in: query
        schema:
          type: string
          enum:
          - csv
          default: csv
      - name: keywords[]
        in: query
        description: Allows the transactions and customers to be searchable by keywords. Added by default. Allows searching by partial ID for customer's who match it.
        schema:
          type: array
          items:
            type: string
      - name: startDate
        in: query
        description: Sets the earliest date to find transactions. Searches on the created_at
        schema:
          type: string
      - name: endDate
        in: query
        description: Sets the latest date to find transactions. Searches on the created_at
        schema:
          type: string
      - name: user_id
        in: query
        description: Filters the data that matches the user ID
        schema:
          type: string
      - name: customer_id
        in: query
        description: Filters data that matches the customer ID
        schema:
          type: string
      - name: meta
        in: query
        description: Will filter results set to records that have an exact match
        schema:
          type: string
      - name: total
        in: query
        description: Will filter results set to records that have an exact match
        schema:
          type: number
      - name: pre_auth
        in: query
        description: Will filter results to only show pre-authorization or non pre-authorization transactions
        schema:
          type: boolean
      - name: method
        in: query
        description: Filters the tables based on which payment method was chosen.
        schema:
          type: string
          enum:
          - card
          - bank
          - cash
          - giftcard
          - check
      - name: maxTotal
        in: query
        description: Will filter transactions with totals less than the chosen maxTotal
        schema:
          type: number
      - name: minTotal
        in: query
        description: Will filter transactions with totals more than the chosen minTotal
        schema:
          type: number
      - name: type
        in: query
        description: Will filter transactions based on type
        schema:
          type: string
          enum:
          - capture
          - charge
          - credit
          - pre auth
          - refund
          - void
      - name: allTransactionsTopLevel
        in: query
        description: Will make child transactions (refunds, voids) appear at the top level of the response, allowing you to filter on these child transactions with a startDate and endDate that correspond to the child transaction
        schema:
          type: string
      - name: success
        in: query
        description: Will filter transactions that are successful (true) or not successful
        schema:
          type: boolean
      - name: is_manual
        in: query
        description: 'use: 0, or 1, not true or false. Indicating 1 here filters for manual transactions, meaning these transactions used a payment method of cash, check or giftcard and are simply records of a transaction which occurred outside the payment gateway.'
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_at
          - updated_at
          - total
          - pre_auth
          - last_four
      - name: order
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
