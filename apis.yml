aid: stax
name: Stax
description: Stax (formerly Fattmerchant) is an Orlando, Florida payments technology company that sells
  subscription-priced payment processing to small and large merchants (Stax Pay), embedded payments and
  merchant onboarding to SaaS platforms and ISVs (Stax Connect), compliant credit-card surcharging (CardX
  by Stax), automated subscription billing (Stax Bill), and full-stack processing for partners and ISOs
  (Stax Processing). Its public REST API at apiprod.fattlabs.com covers charges, credits, refunds and
  voids, stored payment methods and tokenization, customers, invoices and invoice schedules, payment links,
  catalog items, terminals and card-present devices, merchant enrollment and underwriting, disputes, statements
  and deposit reporting, teams, users and API keys, and merchant- and partner-level webhooks. Stax.js
  handles browser tokenization; iOS and Android SDKs cover card-present and Tap to Pay. Stax Payments,
  Inc. is a registered ISO/MSP of Fifth Third Bank and Synovus Bank and a registered partner/ISO of Elavon,
  Inc.
url: https://raw.githubusercontent.com/api-evangelist/stax/refs/heads/main/apis.yml
