  /terminal/tokenize:
    post:
      summary: Tokenize
      description: Requests the terminal to securely read a card and create a stored payment method (token) attached to the specified customer for future card-not-present use.
      security:
      - ApiKeyAuth: []
      operationId: tokenize
      parameters: []
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"payment_method_id\": <Stax Payment Method ID>,\n    \"customer_id\": <Stax Customer ID>,\n    \"success\": true,\n    \"type\": \"tokenize\",\n    \"cancelled\": false,\n    \"gatewayStatus\": 200,\n    \"gatewayStatusText\": \"OK\"\n}"
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  required: true
                  description: The id of the customer to attach the newly created tokenized payment method to.
                register:
                  type: string
                  required: true
                  description: The id of the register performing this operation.
                tokenize:
                  type: boolean
                  required: true
                  description: This value must be true.
              required:
              - register
              - tokenize
              - customerId
      tags:
      - Terminal
