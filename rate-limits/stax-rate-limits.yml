- scope: per-ip
  surface: all Stax API routes
  window: 1 minute
  limit: 200
  burst: null
  on_exhaustion: blocked for one hour
  source: https://docs.staxpayments.com/reference/api-throttling
- scope: per-ip
  surface: all Stax API routes — FAILED requests only
  window: 1 minute
