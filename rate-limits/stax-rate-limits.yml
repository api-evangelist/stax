note: 'Stax publishes TWO different global limits on two different reference pages and they do not agree: reference/api-throttling
  says 200 requests/minute per IP, reference/overview says 100 requests/minute. Both are recorded below with their own source.
  The throttling page also adds a FAILED-request limit and an hour-long block, which is the more consequential rule for an
  agent: a retry storm against a 4xx is what actually gets an integration cut off.'
