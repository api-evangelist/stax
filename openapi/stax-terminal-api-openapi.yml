                paymentType:
                  type: string
                  enum:
                  - Credit
                  - Debit
                  - Check
                  - Gift
                  - Loyalty
                  description: 'Possible values: Credit, Debit, Check, Gift, Loyalty. Defaults to Credit.'
                  default: Credit
                transactionId:
                  type: string
                  required: true
                  description: The id of the transaction being voided or refunded. This endpoint will automatically determine whether to void or refund based on batch timing (typically 8pm EST). Before batch settlement, a void will be executed; after settlement, a refund will be executed.
                register:
                  type: string
                  description: The id of the register performing this operation. This should be the 'id' value returned by GET /terminal/register. For refunds, register is optional as the card will be present. For voids, register is optional but if provided must match the register used for the original transaction.
              required:
              - register
              - total
              - transactionId
