                meta:
                  type: string
                  format: json
                  description: i.e. {"tax":2,"subtotal":10} can contain any json objectwill be blindly stored and returned during a GET operation.values in meta may also appear in an email receipt if the template calls for it.the Stax front-end uses subtotal, tax, memo, lineItems = [].
                printReceipt:
                  type: string
                  enum:
