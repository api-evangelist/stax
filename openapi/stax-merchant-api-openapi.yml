    put:
      summary: Update Merchant Registration Data
      description: Upserts registration data for a merchant, used during onboarding.
      operationId: update-merchant-registration-data
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
        description: ID of the merchant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 100 character max. Merchant email address.
                first_name:
                  type: string
                  description: Merchant owner/signer first name. 100 character max.
                last_name:
                  type: string
                  description: Merchant owner/signer last name. 100 character max.
                refund_policy:
                  type: string
                  enum:
                  - '''N'''
                  - '''E'''
                  - '''T'''
                  - '''O'''
                  description: 'Refund policy. N: No Refunds, E: Merchandise Exchange Only, T: 30 Days or Fewer, O: Other'
                business_fax:
                  type: string
                  description: 'Merchant fax number. format: (999) 999-9999, 9999999999, 999-999-9999.'
                business_legal_name:
                  type: string
                  description: Merchant business legal name. 100 character max.
                business_dba:
                  type: string
                  description: Merchant business 'Doing Business As' name (should be same as legal name if no dba).
                business_website:
                  type: string
                  description: merchant business website address (include http://). 100 characters max.
                business_phone_number:
                  type: string
                  description: 'Merchant business phone number, format: (999) 999-9999, 9999999999, 999-999-9999.'
                business_address_1:
                  type: string
                  description: Merchant business address line 1.100 characters max.
                business_address_2:
                  type: string
                  description: merchant business address line 2 (optional if no address line 2). 100 characters max.
                business_address_city:
                  type: string
                  description: Merchant business city.
                business_address_state:
                  type: string
                  description: The two letter abbreviation of the state.
                business_address_zip:
                  type: string
                  description: Merchant business zip
                business_address_country:
                  type: string
                  description: Merchant business country  2 characters.
                business_location_address_1:
                  type: string
                  description: Merchant business address line 1 (if no secondary billing address, this field should be a duplicate of business_address_1)
                business_location_address_2:
                  type: string
                  description: Merchant business address line 2 (if no secondary billing address, this field should be a duplicate of business_address_2)
                business_location_address_city:
                  type: string
                  description: Merchant business city (if no secondary billing address, this field should be a duplicate of business_address_city)
                business_location_address_state:
                  type: string
                  description: Merchant business state two letters (if no secondary billing address, this field should be a duplicate of business_address_state)
                business_location_address_zip:
                  type: string
                  description: Merchant business zip (if no secondary billing address, this field should be a duplicate of business_address_zip).
                business_location_address_country:
                  type: string
                  description: Merchant business country iso alpha-2(if no secondary billing address, this field should be a duplicate of business_address_country).
                business_location_phone_number:
                  type: string
                  description: 'Merchant business phone number, format: (999) 999-9999 (if no secondary billing address, this field should be a duplicate of business_address_phone).'
                business_open_date:
                  type: string
                  description: Merchant business open date. Format MM/DD/YYYY.
                company_type:
                  type: string
                  enum:
                  - A
                  - G
                  - S
                  - F
                  - L
                  - E
                  - P
                  - V
                  - B
                  - R
                  description: 'A: Association/Estate/Trust, G: Government (Federal/State/Local), S: Individual/Sole Proprietor, F: Financial Institution, L: LLC (Limited-Liability Corporation), E: Tax-Exempt Organization (501C), P: Partnership, V: Private Corporation, B: Public Corporation, R: SEC-Registered Entity.'
                business_tax_id:
                  type: string
                  description: 'Merchant business tax id. Format: 12-3456789.'
                annual_volume:
                  type: string
                  description: Merchant's annual credit card only volume.
                annual_gross_ach_revenue:
                  type: string
                  description: Merchant's annual ACH volume. Can be null.
                avg_trans_size:
                  type: string
                  description: Merchant's credit card average transaction size.
                avg_ach_transaction:
                  type: string
                  description: Merchant's average ACH transaction size. Can be null.
                highest_trans_amount:
                  type: string
                  description: Merchant's reported highest credit card transaction amount.
                largest_ach_transaction:
                  type: string
                  description: Merchant's reported highest ACH transaction amount. Can be null.
                card_present_percent:
                  type: string
                  description: 'Merchant volume card present percent eg: 50 (ex. Terminal transactions where card is physically present at time of transaction)'
                card_swiped_percent:
                  type: string
                  description: Merchant volume of card swiped transactions. percent eg 50. Can be null.
                card_not_present_percent:
                  type: string
                  description: Merchant volume not present, e.g., 15 (e.g., transactions taken on the website where the user enters card information into a form).
                moto_percent:
                  type: string
                  description: Merchant volume percentage taken over moto (mail order telephone order) -- typically the same value as card_not_present_percent.
                internet:
                  type: string
                  description: Merchant volume percentage taken over the internet.
                b2b_percent:
                  type: string
                  description: The merchant business to business volume percentage
                international:
                  type: string
                  description: The merchant international volume percentage.
                bank_routing_number:
                  type: string
                  description: The billing bank routing number.
                bank_account_number:
                  type: string
                  description: The billing bank account number.
                bank_account_owner_name:
                  type: string
                  description: The billing bank account owner name.
                pricing_plan:
                  type: string
                  description: 'IMPORTANT: Partners only. Please reach out to your account manager or POC for information on your pricing plan option(s).'
                proc_change:
                  type: string
                  enum:
                  - PROC_CHANGE
                  - NOT_NOW_PROC
                  description: ' Has merchant processed before or are they not currently processing. PROC_CHANGE: merchant is currently processing with a different processor and needs to change processors. NOT_NOW_PROC: merchant is not currently processing payments'
                mcc:
                  type: string
                  description: 'IMPORTANT: Partners only. Please reach out to your account manager or POC for information on mcc codes if needed.'
                service_you_provide:
                  type: string
                  description: The merchant business main service/ product description. Max 200 characters.
                bus_type:
                  type: string
                  description: 'Business type: 1: Retail, 11: Restaurant, 12: Moto, 18: Internet'
                  enum:
                  - '1'
                  - '11'
                  - '12'
                  - '18'
                sub_bus_type:
                  type: string
                  description: 'Sub business type: 19: Retail.key entered, 45: Moto, 13: Dial pay capture, 36: Interchange plus'
                  enum:
                  - '19'
                  - '45'
                  - '13'
                  - '36'
                principal_owners_name:
                  type: string
                  description: The merchant owner principal first and last name.
                job_title:
                  type: string
                  description: The merchant owner title (same as title).
                title:
                  type: string
                  description: The merchant owner title (same as job_title).
                user_dob:
                  type: string
                  description: 'Owner date of birth. Format: MM/DD/YYYY'
                drivers_license_id:
                  type: string
                  description: Driver's license id of the owner/signer. Can be null.
                drivers_license_state:
                  type: string
                  description: The state where driver's license of the owner/signer was issued (Please send in a 2-character state code. ex. "FL" for Florida). Can be null.
                phone_number:
                  type: string
                  description: 'Owner/signer phone number, format: (999) 999-9999.'
                owner_address_1:
                  type: string
                owner_address_2:
                  type: string
                owner_address_city:
                  type: string
                owner_address_state:
                  type: string
                  description: Owner/signer's 2-character state.
                owner_address_country:
                  type: string
                  description: Owner/signer's 2 character state.
                owner_address_zip:
                  type: string
                  description: Postal / Zip code.
                user_ssn:
                  type: string
                  description: Primary owner/signer social security number.
                note:
                  type: string
                  description: max 100 characters.
                electronic_signature:
                  properties:
                    html_content:
                      type: string
                      description: ' Legal content displayed to user (talk to your Partner Success Team for more information).'
                    ip:
                      type: string
                      description: ipv4, ipv6
                    user_id:
                      type: string
                      description: User_id or user email associated with the merchant.
                    email:
                      type: string
                      description: User email associated with the merchant.
                    browser_agent:
                      type: string
                      description: '"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/79.0.3945.88 Safari/537.36".'
                  required: []
                  type: object
                credit_inquiry_electronic_signature:
                  properties:
                    html_content:
                      type: string
                      description: legal content displayed to user which allows Stax to perform soft credit pulls. The credit inquiry must be agreed to independent of the payment processing agreement or any other terms in your application. We recommend having a separate checkbox for the credit inquiry before submitting the application (talk to your Partner Success Team for more information)"You understand that by clicking on the checkbox associated with this notice, you are providing ‘written instructions’ to Stax and any lender to whom Stax forwards this application, in connection with this application, for commercial lending under the Fair Credit Reporting Act, hereby authorizing Stax and any such lender to obtain information from your personal credit report or other information from Experian. You authorize Stax and any such lender to obtain such information solely in connection with this application for commercial lending."
                    ip:
                      type: string
                      description: ' ipv4, ipv6'
                    user_id:
                      type: string
                      description: User ID or user email associated with the merchant.
                    email:
                      type: string
                      description: User email associated with the merchant.
                    browser_agent:
                      type: string
                      description: e.g. "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/79.0.3945.88 Safari/537.36".
                  required: []
                  type: object
                meta:
                  properties:
                    owner_percentage:
                      type: string
                      description: The ownership percentage for primary owner, eg. 50
                    owner_citizenship:
                      type: string
                      description: The ownership 3 character ISO country code for primary owner eg ALA.
                    representatives:
                      properties:
                        title:
                          type: string
                          description: Position within the organization.
                        date_of_birth:
                          type: string
                          description: 'DOB format: MM/DD/YYYY'
                        ssn:
                          type: string
                          description: Representative social security number.
                        drivers_license_id:
                          type: string
                          description: Driver's license id of the representative. Can be NULL.
                        drivers_license_state:
                          type: string
                          description: The state where driver's license was issued (Please send in a 2-character state code. ex. "FL" for Florida).
                        first_name:
                          type: string
                          description: Name of representative.
                        last_name:
                          type: string
                          description: Surname of representative.
                        type:
                          type: string
                          description: Type of owner.
                          enum:
                          - Beneficial Owner
                          - Guarantor
                        ownership_percentage:
                          type: string
                          description: Ownership percentage for company representatives, eg. 50
                        email:
                          type: string
                          description: Representative email.
                        phone:
                          type: string
                          description: Representative phone number.
                        address_1:
                          type: string
                        address_2:
                          type: string
                        address_city:
                          type: string
                        address_state:
                          type: string
                          description: State (two letter) (ex. FL).
                        address_zip:
                          type: string
                        citizenship:
                          type: string
                          description: 3 character ISO country code for company representative, eg. ALA.
                      required: []
                      type: object
                      description: Any additional representatives (required for any owner/representative with 25% or more ownership).
                    '{partnername}_created_at':
                      type: string
                      description: The created at date with the ISV software. Format YYYY-MM-DD.
                    '{partnername}_netnew':
                      type: boolean
                      description: ' Indicates if the merchant is a brand new merchant for the ISV. '
                    '{partnername}_months_processing':
                      type: string
                      description: Indicates the amount of months the merchant has processed payments with another payment solution in the ISV. If none, indicate "0"
                  required: []
                  type: object
                files:
                  type: string
                  description: See Add File To Merchant Registration route for more information.
                autoverify:
                  type: boolean
                  description: Determines whether or not to run autoverification on the registration record. See "Get Registration Documents" for more info on autoverification.
