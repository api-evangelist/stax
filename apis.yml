  description: The Stax REST API (published as "stax-api") exposes 133 operations across 101 paths at https://apiprod.fattlabs.com
    — the Merchant API for payments, payment methods, customers, invoices, payment links, catalog, terminals, transactions
    and webhooks, and the Partner API for merchant creation, enrollment, registration data, API-key issuance, disputes
    and partner-brand webhooks. Authentication is a bearer API key; sandbox and live keys use the same base URL.
