partner_event_count: 15
partner_events:
- event: create_dispute
  description: Triggered when a dispute is created. Returns the dispute object.
- event: create_deposit
  description: 'Triggered when a settlement (deposit) is processed. Returns the settlement record. The `external_id` in the
    payload connects the deposit record to the deposit details. **Note**: This webhook fires in both production and sandbox
    environments, but in sandbox, the `external_id` will not match the `batch_id`. Use this webhook as a notification and
    then call the merchant''s deposit APIs to retrieve the latest deposit details.'
- event: create_invoice
  description: Triggered when a new invoice is created, including invoices created by an invoice schedule. Returns the invoice
    object.
- event: create_payment_method
  description: Triggered when a new payment method is created. Returns the payment method object.
- event: create_transaction
  description: Triggered when a new transaction is created, including transactions created via Stax.js. Returns the transaction
    object.
- event: create_user
  description: Triggered when a new user is created. Returns the user object.
- event: update_dispute
  description: Triggered when a dispute is updated, such as when the dispute status changes. Returns the updated dispute object.
- event: update_payment_method
  description: Triggered when a payment method is updated. Returns the updated payment method object. The update may originate
    from an action by the merchant user or from Stax updating information via account updater services.
- event: update_transaction
  description: 'Triggered when a transaction is updated. Returns the updated transaction object. **Note**: This does not fire
    when a transaction''s `settled_at` date is added. For ACH transactions, use the`update_transaction_settled`.'
- event: update_transaction_settled
  description: Triggered when an ACH transaction has settled or not settled. Returns the original transaction object. If the
    transaction settled, the `settled_at` date will be populated. If the transaction was clawed back, the `child_transactions`
    array will include the associated void transaction. For more details on ACH settlement, refer to our ACH documentation.
- event: fee_statement_ready
  description: Receive a notification through the webhook indicating that my statement is ready
- event: create_merchant
  description: Triggered when a new merchant is created under the partner brand. This is particularly useful for partners
    utilizing the Stax Landing Page Enrollment option. Returns the merchant object.
- event: update_underwriting
  description: Triggered when a merchant registration's underwriting status changes, including `underwriting_status`, `underwriting_substatuses`,
    or `underwriting_note`. Continue listening to this webhook until `registration.underwriting_status` is `APPROVED`. Returns
    the merchant's registration object.
- event: update_merchant_status
  description: Triggered when a merchant's status changes. When `merchant.status` is set to `ACTIVE`, the merchant can begin
    processing payments. Returns the merchant object.
- event: update_electronic_signature
  description: Triggered when a merchant signer has signed their merchant application. Returns the merchant's registration
    object. Triggered by changes to the `registration.electronic_signature` value.
