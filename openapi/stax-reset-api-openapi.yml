openapi: 3.2.0
info:
  title: stax-api Reset API
  version: '0.1'
servers:
- url: https://apiprod.fattlabs.com/
security:
- ApiKeyAuth: []
tags:
- name: Reset
paths:
  /reset/{token}:
    post:
      summary: Reset Password
      description: ''
      operationId: reset-password
      parameters:
      - name: token
        in: path
        schema:
          type: string
        required: true
      - name: password
        in: query
        required: true
        schema:
          type: string
      - name: password_confirmation
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                  - token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..Io7dLSUBayeRbgZEkq60M3b7hmVzuWLEpj0r5bE7hYk
                    user:
