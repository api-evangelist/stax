  /payment-method/:
    post:
      summary: Create a Card Payment Method
      description: Create a new credit or debit card payment method by securely tokenizing the card details.
      operationId: create-a-payment-method
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - customer_id
              - method
              - person_name
              - card_number
              - card_cvv
              - card_type
              - card_exp
              properties:
                customer_id:
                  type: string
                  description: The customer id which will be associated with the payment method
                method:
                  type: string
                  default: card
                  enum:
                  - card
                person_name:
                  type: string
                  description: Account holder first and last name. For company card/account, you can use Company Name
                card_number:
                  type: string
                card_cvv:
                  type: number
                card_exp:
                  type: string
                  description: 4 digit expiration (ex. "0427")
                card_type:
                  type: string
                  description: null is accepted
                address_1:
                  type: string
                  description: This may be used for AVS.
                address_2:
                  type: string
                address_city:
                  type: string
                  description: 'The cIty associated with the cardholder. '
                address_state:
                  type: string
                  description: 'Use the 2-letter state abbreviation. '
                address_zip:
                  type: string
                  description: This may be used for AVS.
                address_country:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Payment Method
  /payment-method/{id}:
    delete:
