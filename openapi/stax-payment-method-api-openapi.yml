      - name: card_type
        in: query
        description: 10 character max. null is acceptable.
        schema:
          type: string
      - name: card_exp
        in: query
        schema:
          type: string
        description: 4 digits of the expiry date.
      - name: has_cvv
        in: query
        schema:
          type: boolean
      - name: bank_name
        in: query
        required: false
        schema:
          type: string
        description: 255 character max. If supplied, MUST have a value, it is not nullable.
      - name: bank_type
        in: query
        schema:
          type: string
          enum:
          - checking
          - savings
        description: ' If supplied, MUST have a value, it is not nullable.'
      - name: bank_holder_type
        in: query
        schema:
          type: string
          enum:
