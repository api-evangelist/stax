note: 'The Stax MCP server is a documentation/OpenAPI navigator over the same stax-api contract, not a per-resource tool set.
  None of its six tools maps 1:1 to a single REST operationId: five are meta-tools over the spec and docs, and execute-request
  is a generic passthrough that can reach ANY of the 133 operations. That is the honest crosswalk, and it is why rest_only
  is the entire operation list rather than a short remainder.'
